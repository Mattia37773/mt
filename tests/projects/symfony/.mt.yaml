# Docker Compose Project Configuration
#projectCompose:
# paths relative to project root
projectName: codesnippets
paths:
    dockerCompose: docker/docker-compose-dev.yaml
    env: docker/.env
db:
    containerName: "db"
    provider: "mysql"
    name: "appDb"
    password: ${MYSQL_PASSWORD}
    user: "uDb"
backend:
    containerName: fpm
frontend:
    containerName: fpm
