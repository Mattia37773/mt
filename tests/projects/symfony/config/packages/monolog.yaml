monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
    use_microseconds: falsespring boot dc

when@dev:
    monolog:
        handlers:
            main-log:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%-web.log"
                action_level: warning
                #excluded_http_codes: [404, 405]
                channels: [ '!event', '!php', '!deprecation', "!app","!console" ]
            app-log:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%-app.log"
                level: debug
                #excluded_http_codes: [404, 405]
                channels: [ "app" ]
            console-log:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%-console.log"
                level: warning
                channels: [ "console" ]
            deprecation-log:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%-deprecation.log"
                action_level: warning
                channels: [ "php", "deprecation"]
            # To follow logs in real time, execute the following command:
            # `bin/console server:log -vv`
            server_log:
                type: server_log
                process_psr_3_messages: false
                host: 127.0.0.1:9911
                channels: [ "app" ]

when@test:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                #excluded_http_codes: [404, 405]
                channels: ['!event', '!deprecation']

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: warning
                handler: main_log
                #excluded_http_codes: [ 404, 405 ]
                buffer_size: 10
                channels: ['!deprecation']
            main_log:
                type: stream
                path: php://stderr
                level: info
            deduplicated:
                type: deduplication
                handler: symfony_mailer
            symfony_mailer:
                type: symfony_mailer
                from_email: 'noreply@storybranch.ch'
                to_email: 'team@storybranch.ch'
                subject: 'An Error Occurred! %%message%%'
                level: error
                formatter: monolog.formatter.html
                content_type: text/html
