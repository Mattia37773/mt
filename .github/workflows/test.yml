name: Tests

on:
  push:
  #branches: [ "main" ]
  pull_request:
  #branches: [ main ]
  workflow_call: 

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26-intel,windows-latest]#ubuntu-latest# #

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    env:
      MODULE_PATH: "github.com/mattia37773"
      APP_NAME: "mt"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      #  * --- DOCKER SETUP Mac OS ---
      - name: Setup Docker (Mac OS)
        uses: gh-workflow/setup-docker-desktop-macos@0.0.12
        if: runner.os == 'macOS'
        with:
          print_diagnostics: false

      # * --- DOCKER SETUP (WINDOWS) ---
      - name: Setup Docker (Windows)
        if: runner.os == 'Windows'
        run: |
          # 1. Docker-Dienst auf Windows starten
          echo "Starting Docker service on Windows..."
          net start docker || true

          # 2. Status & Versionen prüfen
          docker version
          docker compose version

      - name: Verify Docker Setup
        run: |
          docker --version
          docker compose version
          docker compose -f tests/projects/symfony/docker/docker-compose.yaml up -d --build

      # * --- TESTSUITE ---
      - name: Running Testsuite
        run: |
          echo "Testing with unittests..."
          echo

          # Dateiendung für Windows berücksichtigen (.exe)
          EXE=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXE=".exe"
          fi

          mkdir -p tests/bin

          echo "Removing old binaries"
          rm -f tests/bin/homebrew-install$EXE
          rm -f tests/bin/go-install$EXE
          rm -f tests/bin/source-install$EXE

          echo "Building binaries for testing update"
          echo

          # source install
          go build \
            -ldflags="\
              -X '${MODULE_PATH}/${APP_NAME}/config.OverrideCurrentVersion=v1.0.0' \
              -X '${MODULE_PATH}/${APP_NAME}/config.OverrideBuildMethod=source'" \
            -o tests/bin/source-install$EXE

          # go install
          go build \
            -ldflags="\
              -X '${MODULE_PATH}/${APP_NAME}/config.OverrideCurrentVersion=v1.0.0'" \
            -o tests/bin/go-install$EXE

          # homebrew install
          go build \
            -ldflags="\
              -X '${MODULE_PATH}/${APP_NAME}/config.OverrideCurrentVersion=v1.0.0' \
              -X '${MODULE_PATH}/${APP_NAME}/config.OverrideBuildMethod=homebrew'" \
            -o tests/bin/homebrew-install$EXE

          go clean -cache
          go test -v -p 1 ./tests/cmd/... -ldflags="\
            -X '${MODULE_PATH}/${APP_NAME}/config.OverrideCurrentVersion=v1.0.0'" \
            ./... 

          echo "Removing the binaries"
          rm -f tests/bin/homebrew-install$EXE
          rm -f tests/bin/go-install$EXE
          rm -f tests/bin/source-install$EXE
