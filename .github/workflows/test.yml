name: Tests

on:
  push:
  #branches: [ "main" ]
  pull_request:
  #branches: [ main ]
  workflow_call: 

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
      # TODO macos 
      # todo windows
        os: [ubuntu-latest,macos-26-intel,windows-latest]# macos-26-intel, windows-latest

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    env:
      MODULE_PATH: "github.com/mattia37773"
      APP_NAME: "mt"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      #  * --- DOCKER SETUP Mac OS ---
      - name: Setup Docker (Mac OS)
        uses: gh-workflow/setup-docker-desktop-macos@0.0.12
        if: runner.os == 'macOS'
        with:
          print_diagnostics: false  
        
      - name: Fix Docker DNS Settings
        run: |
          # Docker Engine Konfiguration mit Google/Cloudflare DNS anlegen/erweitern
          sudo mkdir -p /etc/docker
          echo '{"dns": ["8.8.8.8", "1.1.1.1"]}' | sudo tee /etc/docker/daemon.json
          
          # Alternativ die Settings-Datei von Docker Desktop auf macOS anpassen
          SETTINGS_FILE="$HOME/Library/Group Containers/group.com.docker/settings.json"
          if [ -f "$SETTINGS_FILE" ]; then
            # DNS-Eintrag per jq hinzufügen
            jq '.dns = ["8.8.8.8", "1.1.1.1"]' "$SETTINGS_FILE" > tmp.json && mv tmp.json "$SETTINGS_FILE"
          fi

      # * --- DOCKER SETUP (WINDOWS) ---
      - name: Setup Docker (Windows)
        if: runner.os == 'Windows'
        run: |
          # 1. Docker-Dienst auf Windows starten
          echo "Starting Docker service on Windows..."
          net start docker || true

      # * --- verify SETUP (docker) ---
      - name: Verify Docker Setup
        run: |
          docker --version
          docker compose version

      # * --- TESTSUITE ---
      - name: Run Testsuite (macos & linux)
        if: runner.os == 'macOS' || runner.os == 'Linux'
        run: |
          GOOS="$(go env GOOS)"

          echo "Testing with unittests..."
          echo

          echo "Removing the binaries"
          rm -rf tests/bin/${GOOS}/
          mkdir -p tests/bin/${GOOS}

          echo "Building binaries for testing update"
          echo

          # source install
          GIT_TAG="${GIT_TAG}" go build \
            -ldflags="\
              -X '${MODULE_PATH}/${APP_NAME}/config.OverrideCurrentVersion=v1.0.0' \
              -X '${MODULE_PATH}/${APP_NAME}/config.OverrideBuildMethod=source'" \
            -o "tests/bin/${GOOS}/source-install"

          # go install
          GIT_TAG="${GIT_TAG}" go build \
            -ldflags="\
              -X '${MODULE_PATH}/${APP_NAME}/config.OverrideCurrentVersion=v1.0.0'" \
            -o "tests/bin/${GOOS}/go-install"

          # homebrew install
          GIT_TAG="${GIT_TAG}" go build \
            -ldflags="\
              -X '${MODULE_PATH}/${APP_NAME}/config.OverrideCurrentVersion=v1.0.0' \
              -X '${MODULE_PATH}/${APP_NAME}/config.OverrideBuildMethod=homebrew'" \
            -o "tests/bin/${GOOS}/homebrew-install"

          go clean -cache

          go test -v -p 1 ./tests/cmd/... \
            -ldflags="\
              -X '${MODULE_PATH}/${APP_NAME}/config.OverrideCurrentVersion=v1.0.0' \
            " ./... | grep -v '\[no test files\]'

      - name: Run tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $GOOS = go env GOOS

          Write-Host "GOOS=$GOOS"
          Write-Host "Testing with unittests..."
          Write-Host ""

          Write-Host "Removing the binaries"
          Remove-Item -Recurse -Force "tests/bin/$GOOS" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "tests/bin/$GOOS" | Out-Null

          Write-Host "Building binaries for testing update"
          Write-Host ""

          # source install
          $env:GIT_TAG = "${{ env.GIT_TAG }}"
          go build `
            -ldflags="-X '${{ env.MODULE_PATH }}/${{ env.APP_NAME }}/config.OverrideCurrentVersion=v1.0.0' -X '${{ env.MODULE_PATH }}/${{ env.APP_NAME }}/config.OverrideBuildMethod=source'" `
            -o "tests/bin/$GOOS/source-install.exe"

          # go install
          go build `
            -ldflags="-X '${{ env.MODULE_PATH }}/${{ env.APP_NAME }}/config.OverrideCurrentVersion=v1.0.0'" `
            -o "tests/bin/$GOOS/go-install.exe"

          # homebrew install
          go build `
            -ldflags="-X '${{ env.MODULE_PATH }}/${{ env.APP_NAME }}/config.OverrideCurrentVersion=v1.0.0' -X '${{ env.MODULE_PATH }}/${{ env.APP_NAME }}/config.OverrideBuildMethod=homebrew'" `
            -o "tests/bin/$GOOS/homebrew-install.exe"

          go clean -cache

          go test -v -p 1 ./tests/cmd/... `
            -ldflags="-X '${{ env.MODULE_PATH }}/${{ env.APP_NAME }}/config.OverrideCurrentVersion=v1.0.0'" `
            ./... | Where-Object { $_ -notmatch '\[no test files\]' }

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

